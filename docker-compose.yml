services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pantry:pantry@db:5432/pantry
      JWT_SECRET: dev-only-change-me
      CAPACITY_FRESH_HOURS: "48"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
